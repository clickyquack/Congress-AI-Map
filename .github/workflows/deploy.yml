name: Deploy to politicalwillai.org

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-congress-map
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # GitHub Pages subpath: direct loads of nested routes fall back to the app shell.
      - name: Add SPA fallback for subpath hosting
        shell: bash
        run: cp dist/index.html dist/404.html

      # Astro copies public/ into the Pages artifact; main site workflow rebuilds on push.
      - name: Publish to clickyquack/political-will-ai/public/congress-map/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.POLITICAL_WILL_AI_DEPLOY_TOKEN }}
          repository: clickyquack/political-will-ai
          branch: main
          folder: dist
          target-folder: public/congress-map
          clean: true
          single-commit: true
          commit-message: Deploy congress map (${{ github.sha }})
